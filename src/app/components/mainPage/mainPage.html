<div class="mainPage background-img">
  <page-header></page-header>

  <div class="todosList">
    @for (t of todoStore.todos(); track t.id) {
      <todo [todo]="t" />
    }
  </div>

  @if (isAddTodoModalOpen()) {
    <div class="modalOverlay">
      <add-todo-modal></add-todo-modal>
    </div>
  }
</div>
